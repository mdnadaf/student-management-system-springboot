spring.application.name=studentmanagement

# Server port (Render dynamically provides $PORT, fallback to 8080 locally)
server.port=${PORT:8080}

# Database connection (Supports TiDB/Cloud MySQL via Env Vars, fallback to localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_mgmt_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@mIn123@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
