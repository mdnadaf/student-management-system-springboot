spring.application.name=studentmanagement

# Server & Render HTTPS reverse proxy support
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Database (secrets via environment variables; local MySQL defaults for dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_mgmt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP pool tuned for Render free tier (512 MB RAM) and TiDB Cloud Serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=true

# Actuator (expose only /actuator/health for Render health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
